# StreakOS boot menu. Each entry asks for a list of video modes in order of
# preference and falls back to whatever the firmware offers ("auto").
set timeout=3
set timeout_style=menu
set default=0
insmod all_video
insmod gfxterm

menuentry "StreakOS" {
    multiboot2 /boot/streakos.elf
    # must come after multiboot2, which sets gfxpayload from the kernel header
    set gfxpayload=1280x800x32,1366x768x32,1280x720x32,1024x768x32,auto
    boot
}
menuentry "StreakOS (Full HD 1920x1080)" {
    multiboot2 /boot/streakos.elf
    # must come after multiboot2, which sets gfxpayload from the kernel header
    set gfxpayload=1920x1080x32,1600x900x32,1280x800x32,auto
    boot
}
menuentry "StreakOS (1024x768)" {
    multiboot2 /boot/streakos.elf
    # must come after multiboot2, which sets gfxpayload from the kernel header
    set gfxpayload=1024x768x32,auto
    boot
}
menuentry "StreakOS (without USB driver - use if keyboard or mouse stop working)" {
    multiboot2 /boot/streakos.elf nousb
    set gfxpayload=1280x800x32,1366x768x32,1280x720x32,1024x768x32,auto
    boot
}
menuentry "StreakOS (safe graphics 800x600)" {
    multiboot2 /boot/streakos.elf
    # must come after multiboot2, which sets gfxpayload from the kernel header
    set gfxpayload=800x600x32,800x600,auto
    boot
}
