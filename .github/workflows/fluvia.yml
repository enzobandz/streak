name: Fluvia

on:
  push:
    paths: ["os/**", ".github/workflows/fluvia.yml"]
  pull_request:
    paths: ["os/**", ".github/workflows/fluvia.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iso:
    name: Build and boot-test the ISO
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools qemu-system-x86 ovmf python3-pil
      - name: Build
        run: make -C os
      - name: Boot test (BIOS and UEFI)
        run: cd os && ./tools/smoke_test.sh build/fluvia.iso
      - name: End-to-end test (every app, persistence across reboot, shutdown)
        run: cd os && ./tools/e2e.sh build/fluvia.iso build/e2e
      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluvia-e2e-screenshots
          path: os/build/e2e/**/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: fluvia-iso
          path: os/build/fluvia.iso
